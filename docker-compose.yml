version: '3.8'

services:
  certifastcrm:
    image: certifastcrm:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.certifastcrm.rule=Host(`certifast.mantovan.com.br`)"
        - "traefik.http.routers.certifastcrm.entrypoints=websecure"
        - "traefik.http.routers.certifastcrm.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.certifastcrm.loadbalancer.server.port=80"
        - "traefik.docker.network=minha_rede"
    networks:
      - minha_rede

networks:
  minha_rede:
    external: true
