name: Deploy CertiID

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: 147.79.111.76
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/certiid
            git fetch origin main
            git reset --hard origin/main
            bash ./deploy.sh

  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Edge Functions no Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar Edge Function chatwoot-webhook
        run: supabase functions deploy chatwoot-webhook --project-ref cvfrhfiaprdtwxxplngk --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
